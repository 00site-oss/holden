<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Holden Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:Montserrat,sans-serif;background:#f3f6fa;color:#334155}
.inp{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;background:#fff;color:#0b2545}
.inp:focus{outline:2px solid #1580c8;outline-offset:-1px;border-color:transparent}
.lbl{display:block;font-size:12px;font-weight:700;color:#0b2545;margin-bottom:4px}
.bp{background:#1580c8;color:#fff;font-weight:700;font-size:14px;padding:9px 18px;border-radius:8px;display:inline-flex;align-items:center;gap:8px}
.bp:hover{background:#106aa6}.bp:disabled{opacity:.6}
.bs{background:#fff;color:#0b2545;border:1px solid #cbd5e1;font-weight:700;font-size:14px;padding:8px 16px;border-radius:8px;display:inline-flex;align-items:center;gap:8px}
.bs:hover{background:#f1f5f9}
.bd{color:#b91c1c}.bd:hover{background:#fef2f2}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(11,37,69,.08);border:1px solid #e2e8f0}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;font-weight:600;font-size:14px;color:#cbd5e1}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:#1580c8;color:#fff}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;text-transform:capitalize}
.st-new{background:#e0f2fe;color:#075985}.st-contacted{background:#fef3c7;color:#92400e}.st-scheduled{background:#ede9fe;color:#5b21b6}.st-done{background:#dcfce7;color:#166534}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#64748b;font-weight:700;text-align:left;padding:10px 14px;background:#f8fafc}
td{padding:12px 14px;border-top:1px solid #eef2f6;font-size:14px;vertical-align:top}
tbody tr.click:hover{background:#f8fbff;cursor:pointer}
.tab{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:#475569}
.tab.on{background:#0b2545;color:#fff}
#toast{transition:opacity .2s}
[hidden]{display:none!important}
</style>
</head>
<body>

<!-- Sign in / first-time setup -->
<div id="auth" class="min-h-screen flex items-center justify-center p-4" hidden>
 <form id="authF" class="card w-full max-w-sm p-8 flex flex-col gap-4">
  <div class="flex items-center gap-3"><img src="/images/logo.png" alt="" class="h-12 w-12 object-contain rounded" onerror="this.style.display='none'"><div><div class="font-extrabold text-[#0b2545] text-lg">Holden Admin</div><div id="authSub" class="text-xs text-slate-500">Sign in to continue</div></div></div>
  <div id="setupFields" class="flex flex-col gap-4" hidden><div><label class="lbl" for="aName">Your name</label><input id="aName" class="inp" autocomplete="name"></div></div>
  <div><label class="lbl" for="aEmail">Email</label><input id="aEmail" type="email" class="inp" autocomplete="username" required></div>
  <div><label class="lbl" for="aPw">Password</label><input id="aPw" type="password" class="inp" autocomplete="current-password" required></div>
  <p id="authErr" class="text-sm text-red-700 font-semibold" role="alert"></p>
  <button class="bp justify-center" id="authBtn">Sign in</button>
  <a href="/" class="text-xs text-center text-slate-500 hover:underline">← Back to website</a>
 </form>
</div>

<!-- App -->
<div id="app" class="min-h-screen md:flex" hidden>
 <aside class="bg-[#0b2545] text-white md:w-60 md:min-h-screen md:fixed md:inset-y-0 flex md:flex-col">
  <div class="p-5 flex items-center gap-3 border-b border-white/10 w-full md:w-auto"><span class="w-9 h-9 rounded-lg bg-[#8dc63f] text-[#0b2545] flex items-center justify-center font-black">H</span><div><div class="font-extrabold text-sm">Holden</div><div class="text-[11px] text-slate-400">Admin panel</div></div>
   <button id="mnav" class="md:hidden ml-auto w-9 h-9" aria-label="Menu"><i class="fa-solid fa-bars"></i></button></div>
  <nav id="nav" class="nav p-3 flex-col gap-1 hidden md:flex absolute md:static top-[73px] inset-x-0 bg-[#0b2545] z-30">
   <a href="#dashboard" data-p="stats"><i class="fa-solid fa-chart-line w-4"></i>Dashboard</a>
   <a href="#bookings" data-p="bookings"><i class="fa-regular fa-calendar-check w-4"></i>Bookings <span id="newBadge" class="ml-auto text-[11px] bg-[#8dc63f] text-[#0b2545] rounded-full px-2" hidden></span></a>
   <a href="#content" data-p="content"><i class="fa-regular fa-pen-to-square w-4"></i>Site content</a>
   <a href="#team" data-p="users"><i class="fa-solid fa-users w-4"></i>Team</a>
   <a href="#account"><i class="fa-regular fa-user w-4"></i>My account</a>
   <a href="/" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square w-4"></i>View website</a>
  </nav>
  <div class="mt-auto p-4 border-t border-white/10 hidden md:block">
   <div id="meName" class="text-sm font-bold"></div><div id="meRole" class="text-xs text-slate-400 capitalize mb-3"></div>
   <button id="logout" class="text-xs text-slate-300 hover:text-white"><i class="fa-solid fa-arrow-right-from-bracket mr-1"></i>Sign out</button>
  </div>
 </aside>
 <main class="md:ml-60 flex-1 p-4 sm:p-8 max-w-6xl" id="main"></main>
</div>

<!-- Booking drawer -->
<div id="drawer" class="fixed inset-0 z-40" hidden>
 <div class="absolute inset-0 bg-slate-900/40" data-close></div>
 <div class="absolute right-0 inset-y-0 w-full max-w-md bg-white shadow-2xl overflow-y-auto p-6" id="drawerBody" role="dialog" aria-modal="true" aria-label="Booking details"></div>
</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4" hidden>
 <div class="absolute inset-0 bg-slate-900/40" data-close></div>
 <div class="relative card w-full max-w-md p-6" id="modalBody" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" class="fixed bottom-5 right-5 z-[60] bg-[#0b2545] text-white text-sm font-semibold px-4 py-3 rounded-lg shadow-xl opacity-0 pointer-events-none" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=s=>s?new Date(s).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
const fmtDay=s=>s?new Date(s+"T12:00").toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"}):"—";
let TOKEN=localStorage.getItem("holdenToken")||"",ME=null,PERMS=[],TEAM=[];
const can=p=>PERMS.includes(p);

function toast(t,bad){const el=$("toast");el.textContent=t;el.style.background=bad?"#b91c1c":"#0b2545";el.style.opacity=1;clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity=0,2600)}
async function api(method,path,body){
 const r=await fetch("/api/"+path,{method,headers:{"Content-Type":"application/json",...(TOKEN?{Authorization:"Bearer "+TOKEN}:{})},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));
 if(r.status===401&&!path.startsWith("auth/")){signOut();throw new Error("Session expired. Please sign in again.")}
 if(!r.ok)throw new Error(j.error||"Request failed ("+r.status+")");
 return j;
}

// ---------- Auth ----------
let SETUP=false;
async function showAuth(){
 $("app").hidden=true;$("auth").hidden=false;
 try{SETUP=(await api("GET","auth/status")).needsSetup}catch(e){$("authErr").textContent="Can't reach the server.";return}
 $("setupFields").hidden=!SETUP;
 $("authSub").textContent=SETUP?"First time here — create the owner account":"Sign in to continue";
 $("authBtn").textContent=SETUP?"Create owner account":"Sign in";
 $("aPw").autocomplete=SETUP?"new-password":"current-password";
 $("aEmail").focus();
}
$("authF").onsubmit=async e=>{
 e.preventDefault();$("authErr").textContent="";$("authBtn").disabled=true;
 try{
  const j=SETUP?await api("POST","auth/setup",{name:$("aName").value,email:$("aEmail").value,password:$("aPw").value})
               :await api("POST","auth/login",{email:$("aEmail").value,password:$("aPw").value});
  TOKEN=j.token;localStorage.setItem("holdenToken",TOKEN);$("aPw").value="";await start();
 }catch(err){$("authErr").textContent=err.message}
 $("authBtn").disabled=false;
};
function signOut(){TOKEN="";localStorage.removeItem("holdenToken");ME=null;showAuth()}
$("logout").onclick=signOut;

async function start(){
 try{const j=await api("GET","me");ME=j.user;PERMS=j.permissions}catch{return showAuth()}
 $("auth").hidden=true;$("app").hidden=false;
 $("meName").textContent=ME.name;$("meRole").textContent=ME.role;
 document.querySelectorAll("#nav a[data-p]").forEach(a=>a.hidden=!can(a.dataset.p));
 try{TEAM=(await api("GET","users")).users}catch{TEAM=[]}
 refreshBadge();
 route();
}
async function refreshBadge(){try{const s=await api("GET","stats");const b=$("newBadge");b.textContent=s.byStatus.new;b.hidden=!s.byStatus.new}catch{}}

// ---------- Routing ----------
const PAGES={dashboard:["stats",pageDashboard],bookings:["bookings",pageBookings],content:["content",pageContent],team:["users",pageTeam],account:[null,pageAccount]};
function route(){
 if(!ME)return;
 let k=location.hash.slice(1)||"dashboard";
 if(!PAGES[k]||(PAGES[k][0]&&!can(PAGES[k][0])))k=can("stats")?"dashboard":"bookings";
 document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+k));
 $("nav").classList.add("hidden");$("nav").classList.add("md:flex");
 if(DIRTY&&!confirm("You have unsaved content changes. Leave without saving?")){history.replaceState(null,"","#content");return}
 DIRTY=false;
 $("main").innerHTML='<div class="text-slate-400 text-sm">Loading…</div>';
 PAGES[k][1]().catch(e=>{$("main").innerHTML=`<div class="card p-6 text-red-700">${esc(e.message)}</div>`});
}
window.onhashchange=route;
$("mnav").onclick=()=>$("nav").classList.toggle("hidden");
window.onbeforeunload=e=>{if(DIRTY){e.preventDefault();e.returnValue=""}};
document.addEventListener("click",e=>{if(e.target.closest("[data-close]")){$("drawer").hidden=true;$("modal").hidden=true}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("drawer").hidden=true;$("modal").hidden=true}});
const header=(t,sub,right="")=>`<div class="flex flex-wrap items-end justify-between gap-4 mb-6"><div><h1 class="text-2xl font-extrabold text-[#0b2545]">${t}</h1>${sub?`<p class="text-sm text-slate-500 mt-1">${sub}</p>`:""}</div><div class="flex gap-2">${right}</div></div>`;

// ---------- Dashboard ----------
async function pageDashboard(){
 const s=await api("GET","stats");
 const delta=s.thisWeek-s.lastWeek;
 const kpi=(label,val,sub,icon,color)=>`<div class="card p-5 flex gap-4 items-start"><span class="w-10 h-10 rounded-lg flex items-center justify-center text-white" style="background:${color}"><i class="fa-solid ${icon}"></i></span><div><div class="text-xs font-bold text-slate-500 uppercase">${label}</div><div class="text-2xl font-extrabold text-[#0b2545]">${val}</div><div class="text-xs text-slate-500">${sub}</div></div></div>`;
 const max=Math.max(1,...s.weeks.map(w=>w.count));
 const svcMax=Math.max(1,...Object.values(s.byService));
 $("main").innerHTML=header("Dashboard","Welcome back, "+esc(ME.name.split(" ")[0])+". Here's how bookings are going.")+`
 <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
  ${kpi("Total requests",s.total,"All time","fa-inbox","#0b2545")}
  ${kpi("This week",s.thisWeek,(delta>=0?"▲ ":"▼ ")+Math.abs(delta)+" vs last week","fa-calendar-week","#1580c8")}
  ${kpi("Awaiting contact",s.byStatus.new,"Status: new","fa-bell","#d97706")}
  ${kpi("Scheduled",s.byStatus.scheduled,s.byStatus.done+" completed","fa-truck","#4f9a2a")}
 </div>
 <div class="grid lg:grid-cols-5 gap-4 mb-6">
  <div class="card p-5 lg:col-span-3"><h2 class="font-extrabold text-[#0b2545] mb-4">Bookings per week</h2>
   <div class="flex items-end gap-2 h-48">${s.weeks.map(w=>`<div class="flex-1 flex flex-col items-center gap-1 h-full justify-end"><span class="text-xs font-bold text-[#0b2545]">${w.count}</span><div class="w-full rounded-t-md" style="height:${Math.max(3,w.count/max*100)}%;background:${w===s.weeks.at(-1)?"#8dc63f":"#1580c8"}" title="${w.count} bookings"></div><span class="text-[10px] text-slate-500 whitespace-nowrap">${new Date(w.week+"T12:00").toLocaleDateString([], {month:"short",day:"numeric"})}</span></div>`).join("")}</div></div>
  <div class="card p-5 lg:col-span-2"><h2 class="font-extrabold text-[#0b2545] mb-4">Requests by service</h2>
   <div class="flex flex-col gap-3">${Object.entries(s.byService).filter(([k,v])=>k!=="Other"||v).map(([k,v])=>`<div><div class="flex justify-between text-sm mb-1"><span class="font-semibold">${esc(k)}</span><b class="text-[#0b2545]">${v}</b></div><div class="h-2.5 bg-slate-100 rounded-full"><div class="h-full rounded-full bg-[#1580c8]" style="width:${v/svcMax*100}%"></div></div></div>`).join("")}</div></div>
 </div>
 <div class="card overflow-hidden"><div class="p-5 flex justify-between items-center"><h2 class="font-extrabold text-[#0b2545]">Latest requests</h2><a href="#bookings" class="text-sm font-bold text-[#1580c8]">View all →</a></div>
  ${s.recent.length?`<table class="w-full"><thead><tr><th>Customer</th><th>Service</th><th class="hidden sm:table-cell">Received</th><th>Status</th></tr></thead><tbody>${s.recent.map(b=>`<tr class="click" data-id="${b.id}"><td><b class="text-[#0b2545]">${esc(b.name)}</b><div class="text-xs text-slate-500">${esc(b.phone)}</div></td><td>${esc(b.service)}</td><td class="hidden sm:table-cell text-slate-500">${fmtDate(b.createdAt)}</td><td><span class="pill st-${b.status}">${b.status}</span></td></tr>`).join("")}</tbody></table>`:`<p class="px-5 pb-6 text-sm text-slate-500">No booking requests yet. They'll appear here when customers use the form on the website.</p>`}
 </div>`;
 document.querySelectorAll("tr[data-id]").forEach(tr=>tr.onclick=()=>openBooking(s.recent.find(b=>b.id===tr.dataset.id),pageDashboard));
}

// ---------- Bookings ----------
let BK={list:[],q:"",status:"all",service:"all"};
async function pageBookings(){
 const j=await api("GET","bookings");BK.list=j.bookings;BK.statuses=j.statuses;BK.services=j.services;
 $("main").innerHTML=header("Bookings","Appointment requests from the website form.",`<button class="bs" id="csv"><i class="fa-solid fa-download"></i>Export CSV</button>`)+`
 <div class="card">
  <div class="p-4 flex flex-wrap gap-3 items-center border-b border-slate-100">
   <div id="tabs" class="flex flex-wrap gap-1"></div>
   <div class="flex gap-2 ml-auto w-full sm:w-auto">
    <div class="relative flex-1"><i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i><input id="q" class="inp !pl-9" placeholder="Search name, phone, email…" value="${esc(BK.q)}" aria-label="Search bookings"></div>
    <select id="fs" class="inp !w-auto" aria-label="Filter by service"><option value="all">All services</option>${[...BK.services,"Other"].map(x=>`<option ${BK.service===x?"selected":""}>${esc(x)}</option>`).join("")}</select>
   </div>
  </div>
  <div class="overflow-x-auto"><table class="w-full"><thead><tr><th>Customer</th><th>Service</th><th class="hidden md:table-cell">Preferred date</th><th class="hidden lg:table-cell">Assigned</th><th class="hidden sm:table-cell">Received</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
 </div>`;
 $("q").oninput=e=>{BK.q=e.target.value;drawBookings()};
 $("fs").onchange=e=>{BK.service=e.target.value;drawBookings()};
 $("csv").onclick=exportCsv;
 drawBookings();
}
function filtered(){
 const q=BK.q.toLowerCase().trim();
 return BK.list.filter(b=>(BK.status==="all"||b.status===BK.status)&&(BK.service==="all"||b.service===BK.service)&&(!q||[b.name,b.phone,b.email,b.message,b.notes].join(" ").toLowerCase().includes(q)));
}
function drawBookings(){
 const counts=Object.fromEntries(BK.statuses.map(s=>[s,BK.list.filter(b=>b.status===s).length]));
 $("tabs").innerHTML=[["all","All",BK.list.length],...BK.statuses.map(s=>[s,s[0].toUpperCase()+s.slice(1),counts[s]])].map(([k,l,n])=>`<button class="tab ${BK.status===k?"on":""}" data-s="${k}">${l} <span class="opacity-70">${n}</span></button>`).join("");
 $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{BK.status=b.dataset.s;drawBookings()});
 const list=filtered();
 const who=id=>TEAM.find(u=>u.id===id)?.name||"";
 $("rows").innerHTML=list.length?list.map(b=>`<tr class="click" data-id="${b.id}"><td><b class="text-[#0b2545]">${esc(b.name)}</b><div class="text-xs text-slate-500">${esc(b.phone)}${b.email?" · "+esc(b.email):""}</div></td><td>${esc(b.service)}</td><td class="hidden md:table-cell">${fmtDay(b.date)}</td><td class="hidden lg:table-cell text-slate-600">${esc(who(b.assignedTo))||'<span class="text-slate-400">—</span>'}</td><td class="hidden sm:table-cell text-slate-500">${fmtDate(b.createdAt)}</td><td><span class="pill st-${b.status}">${b.status}</span></td></tr>`).join("")
  :`<tr><td colspan="6" class="text-center text-slate-500 py-10">${BK.list.length?"No bookings match these filters.":"No booking requests yet."}</td></tr>`;
 $("rows").querySelectorAll("tr[data-id]").forEach(tr=>tr.onclick=()=>openBooking(BK.list.find(b=>b.id===tr.dataset.id),()=>{drawBookings()}));
}
function exportCsv(){
 const cols=["createdAt","name","phone","email","service","date","status","message","notes"];
 const csv=[cols.join(","),...filtered().map(b=>cols.map(c=>'"'+String(b[c]??"").replace(/"/g,'""')+'"').join(","))].join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="holden-bookings.csv";a.click();
}
function openBooking(b,after){
 const edit=can("bookings:edit");
 $("drawerBody").innerHTML=`
 <div class="flex justify-between items-start mb-5"><div><h2 class="text-xl font-extrabold text-[#0b2545]">${esc(b.name)}</h2><div class="text-xs text-slate-500">Received ${fmtDate(b.createdAt)}</div></div><button data-close class="w-8 h-8 rounded-full hover:bg-slate-100" aria-label="Close"><i class="fa-solid fa-xmark" data-close></i></button></div>
 <div class="grid grid-cols-2 gap-3 mb-5 text-sm">
  <a href="tel:${esc(b.phone.replace(/[^\d+]/g,""))}" class="card p-3 hover:border-[#1580c8]"><div class="text-xs text-slate-500">Phone</div><b class="text-[#1580c8]">${esc(b.phone)}</b></a>
  <div class="card p-3"><div class="text-xs text-slate-500">Email</div>${b.email?`<a class="font-bold text-[#1580c8] break-all" href="mailto:${esc(b.email)}">${esc(b.email)}</a>`:'<span class="text-slate-400">—</span>'}</div>
  <div class="card p-3"><div class="text-xs text-slate-500">Service</div><b class="text-[#0b2545]">${esc(b.service)}</b></div>
  <div class="card p-3"><div class="text-xs text-slate-500">Requested date</div><b class="text-[#0b2545]">${fmtDay(b.date)}</b></div>
 </div>
 ${b.message?`<div class="mb-5"><div class="lbl">Customer message</div><p class="text-sm bg-slate-50 rounded-lg p-3 whitespace-pre-wrap">${esc(b.message)}</p></div>`:""}
 <div class="flex flex-col gap-4">
  <div><label class="lbl" for="dSt">Status</label><select id="dSt" class="inp" ${edit?"":"disabled"}>${BK.statuses?.length?BK.statuses.map(s=>`<option value="${s}" ${b.status===s?"selected":""}>${s[0].toUpperCase()+s.slice(1)}</option>`).join(""):["new","contacted","scheduled","done"].map(s=>`<option value="${s}" ${b.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
  <div class="grid grid-cols-2 gap-3"><div><label class="lbl" for="dAs">Assigned to</label><select id="dAs" class="inp" ${edit?"":"disabled"}><option value="">Unassigned</option>${TEAM.map(u=>`<option value="${u.id}" ${b.assignedTo===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select></div>
  <div><label class="lbl" for="dDt">Appointment date</label><input id="dDt" type="date" class="inp" value="${esc(b.date)}" ${edit?"":"disabled"}></div></div>
  <div><label class="lbl" for="dNo">Internal notes</label><textarea id="dNo" rows="4" class="inp" placeholder="Visible to staff only" ${edit?"":"disabled"}>${esc(b.notes)}</textarea></div>
  <div class="flex gap-2">${edit?`<button class="bp" id="dSave">Save changes</button>`:""}${can("bookings:delete")?`<button class="bs bd ml-auto" id="dDel"><i class="fa-regular fa-trash-can"></i>Delete</button>`:""}</div>
 </div>
 ${b.history?.length?`<div class="mt-6"><div class="lbl">Activity</div><ul class="text-xs text-slate-600 flex flex-col gap-1.5">${b.history.slice().reverse().map(h=>`<li><b>${esc(h.by)}</b> changed status from <span class="pill st-${h.from}">${h.from}</span> to <span class="pill st-${h.to}">${h.to}</span> · ${fmtDate(h.at)}</li>`).join("")}</ul></div>`:""}`;
 $("drawer").hidden=false;
 if($("dSave"))$("dSave").onclick=async()=>{
  try{const j=await api("PATCH","bookings/"+b.id,{status:$("dSt").value,assignedTo:$("dAs").value,date:$("dDt").value,notes:$("dNo").value});
   Object.assign(b,j.booking);toast("Booking updated");$("drawer").hidden=true;refreshBadge();after&&after()}catch(e){toast(e.message,1)}};
 if($("dDel"))$("dDel").onclick=async()=>{
  if(!confirm("Delete this booking for "+b.name+"? This can't be undone."))return;
  try{await api("DELETE","bookings/"+b.id);BK.list=BK.list.filter(x=>x.id!==b.id);toast("Booking deleted");$("drawer").hidden=true;refreshBadge();after&&after()}catch(e){toast(e.message,1)}};
}

// ---------- Site content ----------
let C=null,DIRTY=false;
const ICONS=["fa-faucet-drip","fa-water","fa-bolt","fa-fan","fa-fire-flame-curved","fa-snowflake","fa-temperature-half","fa-wrench","fa-toolbox","fa-house","fa-plug","fa-shower","fa-toilet","fa-wind"];
async function pageContent(){
 const def=await (await fetch("/content-defaults.json",{cache:"no-store"})).json();
 const saved=await api("GET","site");
 C={...def,...saved,contact:{...def.contact,...saved.contact},hero:{...def.hero,...saved.hero},areas:{...def.areas,...saved.areas}};
 delete C._updatedAt;delete C._updatedBy;
 $("main").innerHTML=header("Site content",saved._updatedAt?`Last published ${fmtDate(saved._updatedAt)} by ${esc(saved._updatedBy)}`:"Showing the built-in defaults. Nothing has been published yet.",
  `<a class="bs" href="/" target="_blank"><i class="fa-regular fa-eye"></i>Preview site</a><button class="bp" id="pub"><i class="fa-solid fa-cloud-arrow-up"></i>Publish changes</button>`)+`<div id="ce" class="flex flex-col gap-5"></div>`;
 $("pub").onclick=publish;
 drawContent();
}
const sec=(title,desc,inner,id="")=>`<section class="card p-5 sm:p-6" ${id?`id="${id}"`:""}><h2 class="font-extrabold text-[#0b2545]">${title}</h2><p class="text-xs text-slate-500 mb-4">${desc}</p>${inner}</section>`;
const fld=(label,path,opts={})=>{const v=path.split(".").reduce((a,k)=>a?.[k],C)??"";return `<div class="${opts.cls||""}"><label class="lbl">${label}</label>${opts.area?`<textarea class="inp" rows="${opts.rows||3}" data-f="${path}">${esc(v)}</textarea>`:`<input class="inp" data-f="${path}" value="${esc(v)}" ${opts.ph?`placeholder="${opts.ph}"`:""}>`}</div>`};
const listTools=(key,i,n)=>`<div class="flex gap-1 shrink-0"><button class="bs !p-2" data-mv="${key}:${i}:-1" ${i==0?"disabled":""} aria-label="Move up"><i class="fa-solid fa-arrow-up text-xs"></i></button><button class="bs !p-2" data-mv="${key}:${i}:1" ${i==n-1?"disabled":""} aria-label="Move down"><i class="fa-solid fa-arrow-down text-xs"></i></button><button class="bs bd !p-2" data-rm="${key}:${i}" aria-label="Remove"><i class="fa-regular fa-trash-can text-xs"></i></button></div>`;
function drawContent(){
 $("ce").innerHTML=
 sec("Contact information","Shown in the header, footer, call buttons and map.",`<div class="grid sm:grid-cols-3 gap-4">${fld("Phone","contact.phone")}${fld("Email","contact.email")}${fld("Address","contact.address")}</div>`)+
 sec("Hero banner","The large image at the top and the promo strip below it.",`<div class="grid sm:grid-cols-2 gap-4">${fld("Background image URL","hero.image",{cls:"sm:col-span-2"})}${fld("Promo headline","hero.promoTitle")}${fld("Promo subline","hero.promoSubtitle")}${fld("Tagline","hero.promoTagline",{cls:"sm:col-span-2"})}</div>
  <div class="mt-4 h-28 rounded-lg bg-cover bg-center border" style="background-image:url('${esc(encodeURI(C.hero.image||""))}')" aria-label="Hero image preview"></div>`)+
 sec("Services","The service cards under “Our Services”.",`<div class="flex flex-col gap-3">${C.services.map((s,i)=>`<div class="border border-slate-200 rounded-xl p-4 flex gap-4 items-start"><span class="w-12 h-12 rounded-lg bg-[#0b2545] text-white flex items-center justify-center text-xl shrink-0"><i class="fa-solid ${esc(s.icon)}"></i></span><div class="grid sm:grid-cols-3 gap-3 flex-1">${fld("Name",`services.${i}.name`,{cls:"sm:col-span-2"})}<div><label class="lbl">Icon</label><select class="inp" data-f="services.${i}.icon">${ICONS.map(ic=>`<option ${ic===s.icon?"selected":""} value="${ic}">${ic.replace("fa-","")}</option>`).join("")}</select></div>${fld("Description",`services.${i}.description`,{area:1,rows:2,cls:"sm:col-span-3"})}</div>${listTools("services",i,C.services.length)}</div>`).join("")}</div><button class="bs mt-3" data-add="services"><i class="fa-solid fa-plus"></i>Add service</button>`)+
 sec("Deals","Offer cards in the “Our Deals” carousel. Featured deals get a green outline.",`<div class="flex flex-col gap-3">${C.deals.map((d,i)=>`<div class="border border-slate-200 rounded-xl p-3 flex flex-wrap sm:flex-nowrap gap-3 items-end">${fld("Price",`deals.${i}.price`,{cls:"w-24"})}${fld("Description",`deals.${i}.label`,{cls:"flex-1 min-w-[180px]"})}<label class="flex items-center gap-2 text-sm font-semibold pb-2"><input type="checkbox" data-f="deals.${i}.featured" ${d.featured?"checked":""}>Featured</label>${listTools("deals",i,C.deals.length)}</div>`).join("")}</div><button class="bs mt-3" data-add="deals"><i class="fa-solid fa-plus"></i>Add deal</button>`)+
 sec("Customer reviews","Quotes in the reviews slider.",`<div class="flex flex-col gap-3">${C.reviews.map((r,i)=>`<div class="border border-slate-200 rounded-xl p-3 flex gap-3 items-start"><div class="grid gap-3 flex-1">${fld("Customer name",`reviews.${i}.name`)}${fld("Review",`reviews.${i}.text`,{area:1,rows:3})}</div>${listTools("reviews",i,C.reviews.length)}</div>`).join("")}</div><button class="bs mt-3" data-add="reviews"><i class="fa-solid fa-plus"></i>Add review</button>`)+
 sec("Service areas","One town per line. “More areas” appear when visitors click View More Areas.",`<div class="grid sm:grid-cols-2 gap-4">${fld("Section heading","areas.heading",{cls:"sm:col-span-2"})}<div><label class="lbl">Main areas (${C.areas.main.length})</label><textarea class="inp" rows="10" data-lines="main">${esc(C.areas.main.join("\n"))}</textarea></div><div><label class="lbl">More areas (${C.areas.more.length})</label><textarea class="inp" rows="10" data-lines="more">${esc(C.areas.more.join("\n"))}</textarea></div></div>`);
 const ce=$("ce");
 ce.querySelectorAll("[data-f]").forEach(el=>el.addEventListener(el.type==="checkbox"||el.tagName==="SELECT"?"change":"input",()=>{
  const ks=el.dataset.f.split(".");let o=C;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks.at(-1)]=el.type==="checkbox"?el.checked:el.value;DIRTY=true;
  if(el.tagName==="SELECT"||el.dataset.f==="hero.image")drawContent();
 }));
 ce.querySelectorAll("[data-lines]").forEach(el=>el.oninput=()=>{C.areas[el.dataset.lines]=el.value.split("\n").map(x=>x.trim()).filter(Boolean);DIRTY=true});
 ce.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const[k,i]=b.dataset.rm.split(":");C[k].splice(+i,1);DIRTY=true;drawContent()});
 ce.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const[k,i,d]=b.dataset.mv.split(":").map((x,j)=>j?+x:x);const a=C[k];[a[i],a[i+d]]=[a[i+d],a[i]];DIRTY=true;drawContent()});
 ce.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const k=b.dataset.add;C[k].push(k==="services"?{name:"New service",icon:"fa-wrench",description:""}:k==="deals"?{price:"$0",label:"New deal",featured:false}:{name:"",text:""});DIRTY=true;drawContent()});
}
async function publish(){
 const b=$("pub");b.disabled=true;
 try{await api("PUT","site",C);DIRTY=false;toast("Published — the website is updated");pageContent()}catch(e){toast(e.message,1)}
 b.disabled=false;
}

// ---------- Team ----------
const ROLE_INFO={owner:"Full access, including team management",manager:"Bookings, dashboard and site content",technician:"View and update bookings"};
async function pageTeam(){
 const j=await api("GET","users");TEAM=j.users;
 $("main").innerHTML=header("Team","Everyone who can sign in to this admin panel.",`<button class="bp" id="addU"><i class="fa-solid fa-user-plus"></i>Add team member</button>`)+`
 <div class="grid sm:grid-cols-3 gap-3 mb-5">${j.roles.map(r=>`<div class="card p-4"><div class="font-extrabold text-[#0b2545] capitalize">${r}</div><div class="text-xs text-slate-500">${ROLE_INFO[r]}</div></div>`).join("")}</div>
 <div class="card overflow-x-auto"><table class="w-full"><thead><tr><th>Name</th><th>Role</th><th class="hidden md:table-cell">Last sign in</th><th>Status</th><th></th></tr></thead><tbody>
 ${TEAM.map(u=>`<tr><td><b class="text-[#0b2545]">${esc(u.name)}</b>${u.id===ME.id?' <span class="text-xs text-slate-400">(you)</span>':""}<div class="text-xs text-slate-500">${esc(u.email)}</div></td>
  <td><select class="inp !w-auto !py-1.5" data-role="${u.id}" aria-label="Role for ${esc(u.name)}">${j.roles.map(r=>`<option value="${r}" ${u.role===r?"selected":""}>${r[0].toUpperCase()+r.slice(1)}</option>`).join("")}</select></td>
  <td class="hidden md:table-cell text-slate-500">${u.lastLogin?fmtDate(u.lastLogin):"Never"}</td>
  <td>${u.disabled?'<span class="pill bg-slate-200 text-slate-600">Disabled</span>':'<span class="pill st-done">Active</span>'}</td>
  <td class="text-right whitespace-nowrap"><button class="bs !py-1.5 !px-3 text-xs" data-pw="${u.id}">Reset password</button> ${u.id!==ME.id?`<button class="bs !py-1.5 !px-3 text-xs" data-dis="${u.id}">${u.disabled?"Enable":"Disable"}</button> <button class="bs bd !py-1.5 !px-3 text-xs" data-del="${u.id}" aria-label="Delete ${esc(u.name)}"><i class="fa-regular fa-trash-can"></i></button>`:""}</td></tr>`).join("")}
 </tbody></table></div>`;
 const u=id=>TEAM.find(x=>x.id===id);
 const act=async(fn,msg)=>{try{await fn();toast(msg)}catch(e){toast(e.message,1)}pageTeam()};
 $("addU").onclick=()=>modal("Add team member",`${mf("Name","mName")}${mf("Email","mEmail","email")}<div><label class="lbl" for="mRole">Role</label><select id="mRole" class="inp">${j.roles.map(r=>`<option value="${r}" ${r==="technician"?"selected":""}>${r[0].toUpperCase()+r.slice(1)} — ${ROLE_INFO[r]}</option>`).join("")}</select></div>${mf("Temporary password (8+ characters)","mPw","text")}<p class="text-xs text-slate-500">Share this password with them privately. They can change it under My account.</p>`,
  "Add member",async()=>{await api("POST","users",{name:$("mName").value,email:$("mEmail").value,role:$("mRole").value,password:$("mPw").value});toast("Team member added");pageTeam()});
 document.querySelectorAll("[data-role]").forEach(s=>s.onchange=()=>act(()=>api("PATCH","users/"+s.dataset.role,{role:s.value}),"Role updated"));
 document.querySelectorAll("[data-dis]").forEach(b=>b.onclick=()=>act(()=>api("PATCH","users/"+b.dataset.dis,{disabled:!u(b.dataset.dis).disabled}),"Account updated"));
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Delete "+u(b.dataset.del).name+"'s account?"))act(()=>api("DELETE","users/"+b.dataset.del),"Account deleted")});
 document.querySelectorAll("[data-pw]").forEach(b=>b.onclick=()=>modal("Reset password for "+esc(u(b.dataset.pw).name),mf("New password (8+ characters)","mPw","text")+'<p class="text-xs text-slate-500">They will be signed out everywhere.</p>',"Set password",async()=>{await api("PATCH","users/"+b.dataset.pw,{password:$("mPw").value});toast("Password reset");if(b.dataset.pw===ME.id)signOut()}));
}
const mf=(l,id,type="text")=>`<div><label class="lbl" for="${id}">${l}</label><input id="${id}" type="${type}" class="inp" autocomplete="off"></div>`;
function modal(title,inner,okLabel,onOk){
 $("modalBody").innerHTML=`<h2 class="text-lg font-extrabold text-[#0b2545] mb-4">${title}</h2><form id="mF" class="flex flex-col gap-4">${inner}<p id="mErr" class="text-sm text-red-700 font-semibold" role="alert"></p><div class="flex justify-end gap-2"><button type="button" class="bs" data-close>Cancel</button><button class="bp">${okLabel}</button></div></form>`;
 $("modal").hidden=false;$("modalBody").querySelector("input,select")?.focus();
 $("mF").onsubmit=async e=>{e.preventDefault();try{await onOk();$("modal").hidden=true}catch(err){$("mErr").textContent=err.message}};
}

// ---------- Account ----------
async function pageAccount(){
 $("main").innerHTML=header("My account","")+`<div class="card p-6 max-w-lg">
 <div class="mb-5"><div class="text-lg font-extrabold text-[#0b2545]">${esc(ME.name)}</div><div class="text-sm text-slate-500">${esc(ME.email)} · <span class="capitalize">${ME.role}</span></div><div class="text-xs text-slate-400 mt-1">${ROLE_INFO[ME.role]}</div></div>
 <form id="pwF" class="flex flex-col gap-4"><h2 class="font-extrabold text-[#0b2545]">Change password</h2>
  <div><label class="lbl" for="pC">Current password</label><input id="pC" type="password" class="inp" autocomplete="current-password" required></div>
  <div><label class="lbl" for="pN">New password (8+ characters)</label><input id="pN" type="password" class="inp" autocomplete="new-password" required></div>
  <div><label class="lbl" for="pN2">Repeat new password</label><input id="pN2" type="password" class="inp" autocomplete="new-password" required></div>
  <p id="pErr" class="text-sm text-red-700 font-semibold" role="alert"></p>
  <div><button class="bp">Update password</button></div></form>
 <button class="bs mt-6 md:hidden" onclick="signOut()"><i class="fa-solid fa-arrow-right-from-bracket"></i>Sign out</button></div>`;
 $("pwF").onsubmit=async e=>{e.preventDefault();$("pErr").textContent="";
  if($("pN").value!==$("pN2").value)return $("pErr").textContent="New passwords don't match.";
  try{const j=await api("POST","me/password",{current:$("pC").value,password:$("pN").value});TOKEN=j.token;localStorage.setItem("holdenToken",TOKEN);toast("Password updated");e.target.reset()}catch(err){$("pErr").textContent=err.message}};
}

TOKEN?start():showAuth();
</script>
</body></html>
